<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#222226"/>
      <stop offset="100%" stop-color="#111113"/>
    </linearGradient>
    <linearGradient id="headGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#333338"/>
      <stop offset="100%" stop-color="#1a1a1e"/>
    </linearGradient>
  </defs>

  <!-- 1. STATIONARY BODY & SHOULDERS -->
  <path d="M 60 480 C 72 345, 128 316, 200 316 C 272 316, 328 345, 340 480 Z" fill="url(#bgGrad)" stroke="rgba(200, 169, 126, 0.3)" stroke-width="1.5" />
  <path d="M 165 321 L 200 364 L 235 321" fill="none" stroke="rgba(200, 169, 126, 0.5)" stroke-width="2" />

  <!-- 2. NECK -->
  <rect x="176" y="260" width="48" height="72" fill="#1e1e22" />

  <!-- 3. HEAD (Shifted by directional angle frame) -->
  <rect x="135" y="132" width="130" height="170" rx="48" fill="url(#headGrad)" stroke="rgba(200, 169, 126, 0.4)" stroke-width="1.5" />
  
  <!-- Hair line -->
  <path d="M 132 162 A 68 68 0 0 1 268 162 Z" fill="#161619" />

  <!-- Glasses frame hint -->
  <line x1="140" y1="222" x2="260" y2="222" stroke="rgba(200, 169, 126, 0.3)" stroke-width="1.5" />

  <!-- Nose hint -->
  <path d="M 200 237 L 200 262 L 210 262" fill="none" stroke="#666" stroke-width="2" />

  <!-- Mouth hint (neutral) -->
  <line x1="185" y1="282" x2="215" y2="282" stroke="#555" stroke-width="2.5" />

  <!-- 4. EYES & PUPILS (Offset for directional gaze) -->
  <circle cx="170" cy="212" r="13" fill="#e5e5e5" stroke="rgba(200, 169, 126, 0.5)" stroke-width="1" />
  <circle cx="230" cy="212" r="13" fill="#e5e5e5" stroke="rgba(200, 169, 126, 0.5)" stroke-width="1" />

  <circle cx="170" cy="221" r="6" fill="#0a0a0b" />
  <circle cx="230" cy="221" r="6" fill="#0a0a0b" />

  <!-- Catchlight highlights -->
  <circle cx="168" cy="219" r="2" fill="#ffffff" />
  <circle cx="228" cy="219" r="2" fill="#ffffff" />
</svg>